name: CI

on:
  # 문서만 고친 커밋에 macOS 러너를 태우지 않는다. private 저장소에서
  # macOS 는 10 배로 과금된다.
  push:
    branches: [release, dev]
    paths-ignore: ['**.md', 'LICENSE']
  pull_request:
    branches: [release, dev]
  workflow_dispatch:

# 같은 브랜치에 연속 푸시가 나면 이전 실행은 취소한다. macOS 러너는 비싸다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (SwiftPM)
    strategy:
      # 한쪽이 깨져도 다른 쪽 결과를 본다. 어느 조합에서만 깨지는지가 곧 진단이다.
      fail-fast: false
      matrix:
        # 개발자의 주력 환경과 러너를 맞춘다. 툴체인이 갈리면 CI 실패가 진짜 실패인지
        # 버전 차이인지 구분할 수 없게 된다. 그 환경이 macOS 27 + Xcode 27 로 옮겨갔는데
        # 러너는 macOS 26 하나뿐이라, CI 가 실제로 쓰이는 조합을 한 번도 돌리지 않았다.
        #
        # `macos-27` 라벨은 아직 없다. 그 조합은 `xcode-27` 이미지가 준다 — 이름은 Xcode
        # 를 가리키지만 실제 OS 도 macOS 27.0 이다(actions/runner-images 의
        # `images/macos/xcode-27-arm64-Readme.md`). 아직 preview 라 큐가 밀리거나
        # 불안정할 수 있다. 그런데도 `continue-on-error` 를 주지 않는 것은, 이 WP 의
        # 목적이 바로 macOS 27 실패를 보이게 하는 것이기 때문이다. 이미지 쪽 문제로
        # 판명되면 그때 한 줄로 낮춘다.
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test

  app:
    name: App bundle (xcodebuild)
    # 산출물 성격의 확인이라 러너 하나로 고정한다. 두 벌로 늘려도 얻는 것은 적고,
    # private 저장소로 돌아가면 macOS 분이 10 배로 붙는다.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain
        run: xcodebuild -version

      # 번들이 소유한 설정(Info.plist, 앱 아이콘, ad-hoc 서명)까지 실제로 빌드되는지
      # 확인한다. CODE_SIGN_IDENTITY 가 "-" 라 키체인도 인증서도 필요 없다.
      # deployment target 이 14.0 이므로, 최신 SDK 가 macOS 14 에 없는 API 사용을
      # 컴파일 타임에 잡아준다.
      - name: Build .app
        run: |
          set -o pipefail
          # xcbeautify 는 러너 이미지에 들어 있지만, 없으면 원본 로그로 넘어간다.
          format() { if command -v xcbeautify >/dev/null; then xcbeautify --renderer github-actions; else cat; fi; }
          xcodebuild build \
            -project Posteight.xcodeproj \
            -scheme Posteight \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath BuildResults.xcresult \
            | format

      # Xcode 빌드 실패 로그는 수천 줄이라, 원인만 따로 뽑아 준다.
      - name: Failure diagnostics
        if: failure()
        run: |
          xcrun xcresulttool get build-results --path BuildResults.xcresult \
            || echo "No xcresult available."
