version: 2

updates:
  # 액션은 커밋 SHA 로 고정돼 있다. 태그는 옮겨 달 수 있고, 액션 저장소가 침해되면
  # 다음 릴리스 실행이 빌드 전에 소스를 고치거나 러너의 TAP_TOKEN 을 가져갈 수 있다.
  # 고정의 대가는 갱신이 멈추는 것이라, 그쪽을 dependabot 에 맡긴다. 올라온 PR 의
  # SHA 와 버전 주석이 맞는지는 사람이 본다.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # 액션마다 PR 을 따로 열면 고정의 대가가 소음으로 돌아온다. 한 달에 하나로 묶는다.
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 1
    commit-message:
      prefix: ci
